<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde1e8;--ac:#c8102e;--ac2:#fff;--ok:#1a7f4b;--hd:#1b2430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b2;--bd:#2c3542;--ac:#e5384f;--hd:#0c0f13}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b2;--bd:#2c3542;--ac:#e5384f;--hd:#0c0f13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 18px}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;color:#aab4c3;font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.tab{border:1px solid var(--bd);background:none;color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.tab small{opacity:.75;margin-left:4px}
.sp{flex:1}
main{padding:18px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--ac2);border:0;padding:9px 18px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.alt{background:none;color:var(--tx);border:1px solid var(--bd);font-weight:400}
.vn{font-weight:600;min-height:20px;padding:8px 0}.vn.bad{color:var(--ac)}
.locs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1250px}
th{position:sticky;top:0;background:var(--hd);color:#fff;font-size:12px;text-align:left;padding:8px;white-space:nowrap}
td{border-top:1px solid var(--bd);padding:2px}
td input,td select{border:1px solid transparent;background:transparent;padding:6px}
td input:focus,td select:focus{border-color:var(--ac);background:var(--bg)}
td.n{padding:6px 8px;color:var(--mut)}td.v{padding:6px 8px;min-width:200px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}.x:hover{color:var(--ac)}
.tools{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.tools input{max-width:300px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}
#totop{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;z-index:50}
#totop.show{opacity:1;visibility:visible;transform:none}body.out #totop{display:none}
.warn{background:#fff3cd;color:#664d03;padding:10px 18px;font-size:13px}
body.out header,body.out .bar,body.out main,body.out footer{display:none}
.hd{display:flex;align-items:center;gap:14px}
.logo{height:54px;width:auto;background:#fff;border-radius:10px;padding:4px 8px;flex:none}
.lg{display:block;margin:0 auto 14px;height:96px;width:auto;background:#fff;border-radius:12px;padding:6px 12px}
#login h1,#login .mut{text-align:center}
textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px}
.sg{border-top:1px solid var(--bd);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.sg:first-child{border-top:0}.sg .b{flex:1;white-space:pre-wrap;word-break:break-word}.sg small{color:var(--mut)}
.cr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:18px}
body.out #login{display:flex}
#login .card{width:100%;max-width:360px}
#login h1{margin:0 0 4px;font-size:20px}
#login .f{margin-top:14px}
#login .btn{width:100%;margin-top:18px}
#lerr{color:var(--ac);min-height:18px;margin-top:10px;font-size:13px}
.fl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fl>div{min-width:160px}
.kp{display:flex;flex-wrap:wrap;gap:12px}
.k{flex:1 1 auto;min-width:160px;box-sizing:border-box;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px}
.k span{display:block;font-size:12px;color:var(--mut)}.k b{display:block;font-size:28px;line-height:1.2;margin:2px 0;white-space:nowrap;font-variant-numeric:tabular-nums}.k small{color:var(--mut);font-size:11px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px}
.sr{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin:9px 0}
.sbar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--bd)}
.sbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;min-width:2px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}.lgd div{margin:3px 0}
.lrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.lr{display:grid;grid-template-columns:50px 1fr;gap:8px;margin:12px 0;align-items:center}.ll{font-weight:600}
.bb{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center;margin:3px 0}
.tr{display:flex;height:13px}.tr i{display:block;height:100%}.tr i:first-child{border-radius:3px 0 0 3px}
em{font-style:normal;font-size:12px;color:var(--tx)}
.vr{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;margin:6px 0}
.vt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ptab td{padding:6px 8px}.bd{padding:2px 9px;border-radius:10px;font-size:12px;white-space:nowrap}
@media print{#totop{display:none!important}.bar,#toast,footer,.tools select,header .logo{display:none!important}body{background:#fff}}
.mut{color:var(--mut)}
.sh{display:flex;align-items:center;gap:6px}.sb2{display:flex;flex-direction:column;line-height:1}.sb{background:none;border:0;color:#6f7a8a;cursor:pointer;font-size:10px;padding:1px 3px;line-height:1}.sb:hover{color:#fff}.sb.on{color:#ffcf33}

/* compact register table */
main{max-width:1900px;padding:10px}
.tw>table:not(.ptab){min-width:0;table-layout:auto}
.tw>table:not(.ptab) th{font-size:10.5px;padding:6px 4px;white-space:normal;line-height:1.15;vertical-align:middle}
.tw>table:not(.ptab) td input,.tw>table:not(.ptab) td select{font-size:11px;padding:4px 2px;min-width:0;width:100%}
.tw>table:not(.ptab) td.n{padding:4px;font-size:11px}
.tw>table:not(.ptab) td.v{min-width:0;padding:4px;font-size:11px;line-height:1.2}
.tw>table:not(.ptab) td{padding:1px}
body.out .warn{display:none}
.wh{margin-bottom:14px}
.whh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.whh h3{margin:0}.whh .mut{font-size:12px}.whh .btn{padding:6px 12px}
.whs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.whs .tab{padding:6px 12px}
.whv{position:relative;height:500px;border-radius:10px;overflow:hidden;border:1px solid var(--bd);background:var(--bg)}
.whv canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:default}.whv.ctl{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.whv.ctl canvas{touch-action:none;cursor:grab}.whv.ctl canvas:active{cursor:grabbing}
.whl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wlb{position:absolute;transform:translate(-50%,-100%);background:var(--hd);color:#fff;border-radius:6px;padding:4px 8px;font-size:11px;line-height:1.35;white-space:nowrap;border-left:3px solid var(--ac);transition:opacity .2s}
.wlb b{display:block;font-size:12px}
.whp{position:absolute;top:8px;right:8px;width:270px;max-height:calc(100% - 16px);overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.whp[hidden]{display:none}.pt{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.pk div{background:var(--bg);border-radius:6px;padding:6px 8px}.pk b{display:block;font-size:18px}.pk span{color:var(--mut);font-size:11px}.ps{color:var(--mut);margin:6px 0 2px}
@media (max-width:600px){.whv{height:380px}.wlb{font-size:10px;padding:3px 6px}.whp{width:auto;left:8px;top:auto;bottom:8px;max-height:62%}}
@media print{.wh{display:none}}

/* status colour pills in all register sheets (4620-4623) */
.tw>table:not(.ptab) td select.stp{width:auto;min-width:72px;max-width:100%;border-radius:12px;padding:3px 6px;font-weight:600;text-align:center;text-align-last:center;cursor:pointer}
.tw>table:not(.ptab) td select.stp[data-s="Done"]{background:#1a7f4b;color:#fff}
.tw>table:not(.ptab) td select.stp[data-s="Pending"]{background:#e5384f;color:#fff}
.tw>table:not(.ptab) td select.stp[data-s="In Progress"]{background:#e6a100;color:#fff}
.tw>table:not(.ptab) td select.stp[data-s="N/A"]{background:#8a94a3;color:#fff}
.tw>table:not(.ptab) td select.stp option{background:var(--card);color:var(--tx);font-weight:400}
.tw>table:not(.ptab) td select.stp:disabled{opacity:1}

/* dark / light mode toggle */
#themebtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:100000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(27,36,48,.85);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;transition:transform .2s}
#themebtn:hover{transform:scale(1.08)}#themebtn:active{transform:scale(.94)}
:root[data-theme="dark"] #themebtn{background:rgba(255,255,255,.14)}
@media print{#themebtn{display:none!important}}
body,.card,header,.bar,.tw,input,select,td,th{transition:background-color .25s,color .25s,border-color .25s}
</style>
