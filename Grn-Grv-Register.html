<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRN & GRV Register – Qatar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde1e8;--ac:#c8102e;--ac2:#fff;--ok:#1a7f4b;--hd:#1b2430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b2;--bd:#2c3542;--ac:#e5384f;--hd:#0c0f13}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mut:#93a0b2;--bd:#2c3542;--ac:#e5384f;--hd:#0c0f13}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 18px}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;color:#aab4c3;font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.tab{border:1px solid var(--bd);background:none;color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.tab small{opacity:.75;margin-left:4px}
.sp{flex:1}
main{padding:18px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--ac2);border:0;padding:9px 18px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.alt{background:none;color:var(--tx);border:1px solid var(--bd);font-weight:400}
.vn{font-weight:600;min-height:20px;padding:8px 0}.vn.bad{color:var(--ac)}
.locs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1250px}
th{position:sticky;top:0;background:var(--hd);color:#fff;font-size:12px;text-align:left;padding:8px;white-space:nowrap}
td{border-top:1px solid var(--bd);padding:2px}
td input,td select{border:1px solid transparent;background:transparent;padding:6px}
td input:focus,td select:focus{border-color:var(--ac);background:var(--bg)}
td.n{padding:6px 8px;color:var(--mut)}td.v{padding:6px 8px;min-width:200px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}.x:hover{color:var(--ac)}
.tools{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}.tools input{max-width:300px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none}
#toast.s{opacity:1}
.warn{background:#fff3cd;color:#664d03;padding:10px 18px;font-size:13px}
body.out header,body.out .bar,body.out main,body.out footer{display:none}
.hd{display:flex;align-items:center;gap:14px}
.logo{height:54px;width:auto;background:#fff;border-radius:10px;padding:4px 8px;flex:none}
.lg{display:block;margin:0 auto 14px;height:96px;width:auto;background:#fff;border-radius:12px;padding:6px 12px}
#login h1,#login .mut{text-align:center}
textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px}
.sg{border-top:1px solid var(--bd);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.sg:first-child{border-top:0}.sg .b{flex:1;white-space:pre-wrap;word-break:break-word}.sg small{color:var(--mut)}
.cr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:18px}
body.out #login{display:flex}
#login .card{width:100%;max-width:360px}
#login h1{margin:0 0 4px;font-size:20px}
#login .f{margin-top:14px}
#login .btn{width:100%;margin-top:18px}
#lerr{color:var(--ac);min-height:18px;margin-top:10px;font-size:13px}
.fl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fl>div{min-width:160px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.k{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;padding:12px 14px}
.k span{display:block;font-size:12px;color:var(--mut)}.k b{display:block;font-size:28px;line-height:1.2;margin:2px 0}.k small{color:var(--mut);font-size:11px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px}
.sr{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin:9px 0}
.sbar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--bd)}
.sbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;min-width:2px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}.lgd div{margin:3px 0}
.lrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.lr{display:grid;grid-template-columns:50px 1fr;gap:8px;margin:12px 0;align-items:center}.ll{font-weight:600}
.bb{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center;margin:3px 0}
.tr{display:flex;height:13px}.tr i{display:block;height:100%}.tr i:first-child{border-radius:3px 0 0 3px}
em{font-style:normal;font-size:12px;color:var(--tx)}
.vr{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;margin:6px 0}
.vt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pt td{padding:6px 8px}.bd{padding:2px 9px;border-radius:10px;font-size:12px;white-space:nowrap}
@media print{.bar,#toast,footer,.tools select,header .logo{display:none!important}body{background:#fff}}
.mut{color:var(--mut)}
</style></head><body>

 btn.onclick=async()=>{
  if(!v.vc.value&&!v.inv.value)return toast('Enter at least vendor code or invoice number',1);
  const d={};F.forEach(([k,,t])=>{if(t!=='v')d[k]=v[k].value.trim()});d.vn=vname(d.vc);
  btn.disabled=true;btn.textContent='Saving…';
  try{await api({action:'add',loc,data:d});toast('Saved to Location '+loc);['vc','inv','lpo','rcv','rem','migo','fwd','scan','miro'].forEach(k=>v[k].value='');out.textContent='';loadAll()}
  catch(e){toast('Could not save: '+e.message,1)}

 return $('div',{className:'card'},$('h2',{textContent:'New register entry',style:'margin-top:0'}),
  $('label',{textContent:'Save into which location sheet?'}),locs,g,dl,out,btn,
  $('p',{className:'mut',textContent:'Entries are saved in this browser automatically. Use Export (CSV) to open them in Excel, and Backup (Excel) to keep a copy.'}),(paint(),''))}
/*SUM-START*/
const SF={loc:'all',from:'',to:'',pre:'all',show:'any'};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SCOL={'Done':'#1a7f4b','Pending':'#e5384f','In Progress':'#e6a100','N/A':'#8a94a3','Not set':'#c3c9d3'};
const SLB=['Done','Pending','In Progress','N/A','Not set'];
const PROC=[['migo','GRN (MIGO)'],['fwd','Forward to Accounts'],['scan','Invoice Scanning'],['miro','MIRO']];
const st=v=>SLB.includes(v)?v:'Not set';
const pc=(a,b)=>b?Math.round(a*100/b):0;
const okS=v=>v==='Done'||v==='N/A';
const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`;
const legend=a=>`<div class="lgd lrow">${a.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
function preset(p){const n=new Date(),t=ymd(n);SF.pre=p;
 if(p==='all'){SF.from='';SF.to=''}
 else if(p==='today'){SF.from=SF.to=t}
 else if(p==='7'){const d=new Date(n);d.setDate(d.getDate()-6);SF.from=ymd(d);SF.to=t}
 else if(p==='30'){const d=new Date(n);d.setDate(d.getDate()-29);SF.from=ymd(d);SF.to=t}
 else if(p==='month'){SF.from=ymd(new Date(n.getFullYear(),n.getMonth(),1));SF.to=t}
 else if(p==='lastm'){SF.from=ymd(new Date(n.getFullYear(),n.getMonth()-1,1));SF.to=ymd(new Date(n.getFullYear(),n.getMonth(),0))}}
function kpis(data){const N=data.length,c=k=>data.filter(r=>r[k]==='Pending').length,d=k=>data.filter(r=>r[k]==='Done').length;
 const comp=data.filter(r=>PROC.every(([k])=>okS(r[k]))).length;
 const A=[['Total entries',N,'#3b82f6',''],['GRN (MIGO) pending',c('migo'),SCOL.Pending,pc(c('migo'),N)+'% of entries'],['GRN (MIGO) done',d('migo'),SCOL.Done,pc(d('migo'),N)+'% of entries'],
  ['MIRO pending',c('miro'),SCOL.Pending,pc(c('miro'),N)+'% of entries'],['MIRO done',d('miro'),SCOL.Done,pc(d('miro'),N)+'% of entries'],
  ['Forward to Accounts pending',c('fwd'),SCOL.Pending,pc(c('fwd'),N)+'% of entries'],['Invoice scanning pending',c('scan'),SCOL.Pending,pc(c('scan'),N)+'% of entries'],
  ['Fully completed',comp,SCOL.Done,pc(comp,N)+'% of entries'],['Still open',N-comp,SCOL['In Progress'],pc(N-comp,N)+'% of entries']];
 return '<div class="kp">'+A.map(([t,v,col,s])=>`<div class="k" style="--c:${col}"><span>${t}</span><b>${v}</b><small>${s}</small></div>`).join('')+'</div>'}
function statBars(data){const N=data.length;
 return card('Status by process',PROC.map(([k,t])=>{let segs='';
  SLB.forEach(s=>{const c=data.filter(r=>st(r[k])===s).length;if(c)segs+=`<div style="width:${c*100/N}%;background:${SCOL[s]};color:${s==='Not set'?'#333':'#fff'}" title="${s}: ${c} (${pc(c,N)}%)">${c*100/N>=7?c:''}</div>`});
  return `<div class="sr"><div>${t}</div><div class="sbar">${segs||'<span class="mut" style="padding:4px 8px">no data</span>'}</div></div>`}).join('')+legend(SLB.map(s=>[SCOL[s],s==='Not set'?'Not set (blank)':s])))}
function donut(k,title,data){const N=data.length,C=2*Math.PI*52;let acc=0,segs='',leg='';
 SLB.forEach(s=>{const c=data.filter(r=>st(r[k])===s).length;
  if(c){const len=C*c/N;segs+=`<circle cx="70" cy="70" r="52" fill="none" stroke="${SCOL[s]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"><title>${s}: ${c}</title></circle>`;acc+=len;
   leg+=`<div><i style="background:${SCOL[s]}"></i>${s} <b>${c}</b> <small>(${pc(c,N)}%)</small></div>`}});
 if(!N)segs='<circle cx="70" cy="70" r="52" fill="none" stroke="#c3c9d3" stroke-width="18" opacity=".4"/>';
 const done=data.filter(r=>st(r[k])==='Done').length;
 return card(title,`<div class="dn"><svg viewBox="0 0 140 140" width="140" height="140">${segs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--tx)">${pc(done,N)}%</text><text x="70" y="86" text-anchor="middle" font-size="11" style="fill:var(--mut)">done</text></svg><div class="lgd">${leg||'<span class="mut">No data</span>'}</div></div>`)}
function trend(data){const dated=data.filter(r=>r.date);
 if(!dated.length)return card('Entries over time (MIRO completed vs not)','<p class="mut">No dated entries in this selection.</p>');
 const mon=new Set(dated.map(r=>r.date)).size>45,g={};
 dated.forEach(r=>{const k=mon?r.date.slice(0,7):r.date;g[k]=g[k]||{ok:0,no:0};okS(st(r.miro))?g[k].ok++:g[k].no++});
 const ks=Object.keys(g).sort(),W=700,H=230,pl=34,pb=34,pt=14,mx=Math.max(...ks.map(k=>g[k].ok+g[k].no)),step=(W-pl-10)/ks.length,bw=Math.min(46,step*.7),every=Math.ceil(ks.length/14);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
 for(let i=0;i<=4;i++){const v=Math.round(mx*i/4),y=H-pb-(H-pb-pt)*i/4;s+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" style="stroke:var(--bd)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--mut)">${v}</text>`}
 ks.forEach((k,i)=>{const x=pl+step*i+(step-bw)/2,h1=(H-pb-pt)*g[k].ok/mx,h2=(H-pb-pt)*g[k].no/mx,y2=H-pb-h1-h2;
  s+=`<rect x="${x}" y="${H-pb-h1}" width="${bw}" height="${h1}" fill="#1a7f4b"><title>${k}: MIRO completed ${g[k].ok}</title></rect><rect x="${x}" y="${y2}" width="${bw}" height="${h2}" fill="#e5384f"><title>${k}: MIRO not completed ${g[k].no}</title></rect>`;
  if(i%every===0)s+=`<text x="${x+bw/2}" y="${H-pb+14}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${mon?k:k.slice(8)+'/'+k.slice(5,7)}</text>`;
  if(bw>=16)s+=`<text x="${x+bw/2}" y="${y2-3}" text-anchor="middle" font-size="10" style="fill:var(--tx)">${g[k].ok+g[k].no}</text>`});
 return card('Entries '+(mon?'per month':'per day')+' (MIRO completed vs not)',s+'</svg>'+legend([['#1a7f4b','MIRO completed'],['#e5384f','MIRO not completed']]))}
function byLoc(data,ls){
 const A=ls.map(l=>{const d=data.filter(r=>r.l===l);return{l,n:d.length,g:d.filter(r=>r.migo==='Pending').length,m:d.filter(r=>r.miro==='Pending').length}});
 const mx=Math.max(1,...A.flatMap(x=>[x.n,x.g,x.m])),bar=(v,c)=>`<div class="bb"><div class="tr"><i style="width:${v*100/mx}%;background:${c}"></i></div><em>${v}</em></div>`;
 return card('Locations compared',A.map(x=>`<div class="lr"><div class="ll">${x.l}</div><div>${bar(x.n,'#3b82f6')}${bar(x.g,SCOL.Pending)}${bar(x.m,SCOL['In Progress'])}</div></div>`).join('')+legend([['#3b82f6','Entries'],[SCOL.Pending,'GRN pending'],[SCOL['In Progress'],'MIRO pending']]))}
function topV(data){const m={};
 data.forEach(r=>{const n=vname(r.vc)||(r.vn&&!String(r.vn).startsWith('#')?r.vn:'')||r.vc||'(no vendor)';const o=m[n]=m[n]||{n:0,p:0};o.n++;if(r.migo==='Pending'||r.miro==='Pending')o.p++});
 const a=Object.entries(m).sort((x,y)=>y[1].n-x[1].n).slice(0,10),mx=Math.max(1,...a.map(x=>x[1].n));
 return card('Top 10 vendors by entries',a.length?a.map(([n,o])=>`<div class="vr"><div class="vt" title="${esc(n)}">${esc(n)}</div><div class="tr"><i style="width:${(o.n-o.p)*100/mx}%;background:#3b82f6"></i><i style="width:${o.p*100/mx}%;background:${SCOL.Pending}"></i></div><em>${o.n}</em></div>`).join('')+legend([['#3b82f6','Other entries'],[SCOL.Pending,'GRN or MIRO pending']]):'<p class="mut">No data.</p>')}
function pendList(data,show){
 const T0=new Date();T0.setHours(0,0,0,0);
 const a=data.filter(r=>show==='any'?PROC.some(([k])=>r[k]==='Pending'):r[show]==='Pending').sort((x,y)=>(x.date||'9')<(y.date||'9')?-1:1);
 const bd=v=>{const s=st(v);return `<span class="bd" style="background:${SCOL[s]};color:${s==='Not set'?'#333':'#fff'}">${s==='Not set'?'—':s}</span>`};
 const opts=[['any','Any pending'],['migo','GRN (MIGO) pending'],['miro','MIRO pending'],['fwd','Forward to Accounts pending'],['scan','Invoice scanning pending']].map(([v,t])=>`<option value="${v}"${v===show?' selected':''}>${t}</option>`).join('');
 const body=a.slice(0,200).map(r=>{const days=r.date?Math.round((T0-new Date(r.date+'T00:00:00'))/864e5):'';
  return `<tr><td>${r.l}</td><td>${esc(r.date)}</td><td>${days}</td><td>${esc(vname(r.vc)||(r.vn&&!String(r.vn).startsWith('#')?r.vn:'')||r.vc)}</td><td>${esc(r.inv)}</td><td>${esc(r.lpo)}</td><td>${bd(r.migo)}</td><td>${bd(r.fwd)}</td><td>${bd(r.scan)}</td><td>${bd(r.miro)}</td></tr>`}).join('');
 return `<div class="card" style="margin-top:14px"><div class="tools"><h3 style="margin:0">Pending items <span class="mut">(${a.length})</span></h3><span class="sp"></span><select id="psel" style="max-width:260px">${opts}</select></div>`+
  (a.length?`<div class="tw"><table class="pt" style="min-width:900px"><thead><tr>${['Location','Date','Days open','Vendor','Invoice','LPO','GRN (MIGO)','Fwd to Accounts','Scanning','MIRO'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>${a.length>200?'<p class="mut">Showing the oldest 200.</p>':''}`:'<p class="mut">Nothing pending in this selection 🎉</p>')+'</div>'}
function summaryHTML(data,ls){
 return kpis(data)+'<p class="mut" style="margin:8px 2px 0">Blank statuses are counted as “Not set”, not as pending.</p><div class="cg">'+statBars(data)+donut('migo','GRN (MIGO) status',data)+donut('miro','MIRO status',data)+trend(data)+byLoc(data,ls)+topV(data)+'</div>'+pendList(data,SF.show)}
/*SUM-END*/

function sum(){
 const res=$('div'),locSel=$('select',{},[['all','All locations'],...L.map(l=>[l,'Location '+l])].map(([v,t])=>$('option',{value:v,textContent:t})));
 locSel.value=SF.loc;
 const fr=$('input',{type:'date'}),to=$('input',{type:'date'}),pre=$('div',{className:'locs',style:'margin:14px 0 0'});
 const PB=[['today','Today'],['7','Last 7 days'],['30','Last 30 days'],['month','This month'],['lastm','Last month'],['all','All time']];
 const paint=()=>{[...pre.children].forEach(b=>{if(b.dataset.p)b.className='tab'+(b.dataset.p===SF.pre?' on':'')});fr.value=SF.from;to.value=SF.to};
 const draw=()=>{
  const ls=SF.loc==='all'?L:[SF.loc],data=[];
  ls.forEach(l=>rows[l].forEach(r=>{if((SF.from||SF.to)&&!r.date)return;if(SF.from&&r.date<SF.from)return;if(SF.to&&r.date>SF.to)return;data.push({...r,l})}));
  const rng=SF.from||SF.to?(SF.from||'start')+'  →  '+(SF.to||'today'):'All dates';
  res.innerHTML='<p class="mut" style="margin:0 2px 12px">Showing <b style="color:var(--tx)">'+data.length+'</b> entries · '+(SF.loc==='all'?'All locations':'Location '+SF.loc)+' · '+rng+'</p>'+summaryHTML(data,ls);
  const ps=res.querySelector('#psel');if(ps)ps.onchange=()=>{SF.show=ps.value;draw()}};
 PB.forEach(([p,t])=>pre.append($('button',{className:'tab',textContent:t,'data-p':p,on:{click:()=>{preset(p);paint();draw()}}})));
 pre.append($('span',{className:'sp'}),$('button',{className:'btn alt',textContent:'↺ Reset',on:{click:()=>{SF.loc='all';SF.show='any';locSel.value='all';preset('all');paint();draw()}}}),$('button',{className:'btn alt',textContent:'🖨 Print',on:{click:()=>window.print()}}));
 locSel.onchange=()=>{SF.loc=locSel.value;draw()};
 fr.onchange=to.onchange=()=>{SF.from=fr.value;SF.to=to.value;SF.pre='custom';paint();draw()};
 paint();draw();
 return $('div',{},$('div',{className:'card',style:'margin-bottom:14px'},$('h2',{textContent:'📊 Summary',style:'margin:0 0 12px'}),
  $('div',{className:'fl'},$('div',{},$('label',{textContent:'Location'}),locSel),$('div',{},$('label',{textContent:'From date'}),fr),$('div',{},$('label',{textContent:'To date'}),to)),pre),res)}

 if(u===AUTH.u&&p===AUTH.p){document.getElementById('lerr').textContent='';document.getElementById('lp').value='';setAuth(true);page='entry';loadAll();go()}

['lu','lp'].forEach(i=>document.getElementById(i).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
